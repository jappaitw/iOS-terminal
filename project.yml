name: PocketCode
options:
  bundleIdPrefix: com.jlmxstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "TUBWWB43W7"
    CODE_SIGN_STYLE: Automatic
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: "0.12.0"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.18.0"
  Runestone:
    url: https://github.com/simonbs/Runestone
    exactVersion: "0.5.2"
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages
    exactVersion: "0.1.10"
targets:
  # Experimental harness for the embedded Codex app-server (docs/ON_DEVICE_AI_CLI_FEASIBILITY.md).
  # Links libpocket_codex.a from scripts/build_codex.sh; never part of the shipping app.
  CodexLab:
    type: application
    platform: iOS
    sources:
      - native/CodexLab
      - PocketCode/Sources/LocalShell
      - PocketCode/Python
      - path: PocketCode/PythonApp
        type: folder
        buildPhase: resources
    info:
      path: native/CodexLab/Info.plist
      properties:
        CFBundleDisplayName: CodexLab
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jlmxstudio.pocketcode.codexlab
        SWIFT_OBJC_BRIDGING_HEADER: native/CodexLab/CodexLab-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: "-lpocket_codex"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(PROJECT_DIR)/ThirdParty/codex/device"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(PROJECT_DIR)/ThirdParty/codex/simulator"
    postBuildScripts:
      - name: Install Python standard library
        script: sh "$PROJECT_DIR/scripts/install_python_stdlib.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: ThirdParty/Python.xcframework
        embed: true
  PocketCode:
    type: application
    platform: iOS
    sources:
      - PocketCode/Sources
      - PocketCode/Resources
      - PocketCode/Python
      - path: PocketCode/PythonApp
        type: folder
        buildPhase: resources
    info:
      path: PocketCode/Info.plist
      properties:
        CFBundleDisplayName: Pocode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Export compliance: standard algorithms only (SSH via SwiftNIO SSH / CryptoKit,
        # OpenSSL inside the bundled CPython), exempt — skips the question on every upload.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: PocketCode connects to SSH hosts on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jlmxstudio.pocketcode
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Embedded CPython (official iOS XCframework, see docs/LOCAL_AI_FEASIBILITY.md)
        SWIFT_OBJC_BRIDGING_HEADER: PocketCode/Python/PocketCode-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Embedded Codex agent (Rust staticlib, see docs/ON_DEVICE_AI_CLI_FEASIBILITY.md)
        OTHER_LDFLAGS: "-lpocket_codex"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(PROJECT_DIR)/ThirdParty/codex/device"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(PROJECT_DIR)/ThirdParty/codex/simulator"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - PocketCodeTests
    postBuildScripts:
      - name: Install Python standard library
        script: sh "$PROJECT_DIR/scripts/install_python_stdlib.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: ThirdParty/Python.xcframework
        embed: true
      - package: Citadel
      - package: SwiftTerm
      - package: Runestone
      - package: TreeSitterLanguages
        products:
          - TreeSitterBashRunestone
          - TreeSitterCRunestone
          - TreeSitterCPPRunestone
          - TreeSitterCSSRunestone
          - TreeSitterGoRunestone
          - TreeSitterHTMLRunestone
          - TreeSitterJavaRunestone
          - TreeSitterJavaScriptRunestone
          - TreeSitterJSONRunestone
          - TreeSitterMarkdownRunestone
          - TreeSitterPythonRunestone
          - TreeSitterRubyRunestone
          - TreeSitterRustRunestone
          - TreeSitterSwiftRunestone
          - TreeSitterTypeScriptRunestone
          - TreeSitterTSXRunestone
          - TreeSitterYAMLRunestone
          - TreeSitterTOMLRunestone
          - TreeSitterSQLRunestone
          - TreeSitterPHPRunestone
          - TreeSitterCSharpRunestone
  PocketCodeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PocketCodeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jlmxstudio.pocketcode.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PocketCode
