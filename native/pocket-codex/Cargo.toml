[package]
name = "pocket-codex"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "C FFI wrapper that runs the Codex app-server in-process over a unix socket, for PocketCode's on-device `codex` command."

[lib]
name = "pocket_codex"
crate-type = ["staticlib"]

# PoC: path dependencies into the research checkout (~/Documents/research/codex).
# A fetch_codex.sh script (like fetch_python.sh) will pin and vendor this properly
# before the experimental target ships to anyone else's machine.
[dependencies]
codex-app-server = { path = "../../../research/codex/codex-rs/app-server" }
codex-core = { path = "../../../research/codex/codex-rs/core" }
codex-code-mode-host = { path = "../../../research/codex/codex-rs/code-mode-host" }
codex-arg0 = { path = "../../../research/codex/codex-rs/arg0" }
codex-utils-cli = { path = "../../../research/codex/codex-rs/utils/cli" }
codex-utils-absolute-path = { path = "../../../research/codex/codex-rs/utils/absolute-path" }
codex-config = { path = "../../../research/codex/codex-rs/config" }
codex-protocol = { path = "../../../research/codex/codex-rs/protocol" }
codex-websocket-auth = { path = "../../../research/codex/codex-rs/websocket-auth" }
tokio = { version = "1", features = ["rt-multi-thread"] }
libc = "0.2"

# Upstream mxc-sdk gates its `run` module to windows/linux/macos but calls it
# unconditionally; the vendored copy cfg-gates the two call sites (see
# docs/ON_DEVICE_AI_CLI_FEASIBILITY.md — PR-able upstream).
[patch."https://github.com/microsoft/mxc"]
mxc-sdk = { path = "../../../research/mxc-patched/src/mxc-sdk" }

# Mirrors codex-rs's own [patch.crates-io] table — patch tables are not inherited
# across workspaces, and codex needs these forks (e.g. tokio-tungstenite's `proxy`
# feature only exists in the openai fork).
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
# v8 deliberately NOT patched to the openai fork here: the fork has no
# published binaries, so its source would pair with denoland's prebuilt iOS
# lib and crash on a snapshot magic-number mismatch. Stock denoland v152.2.0
# keeps source, binding and lib from one release.

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }

[profile.release]
opt-level = "s"
lto = "thin"
